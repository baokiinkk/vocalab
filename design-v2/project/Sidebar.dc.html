<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Điều hướng</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Điều hướng chính" style="{{ navStyle }}">
  <sc-if value="{{ showBrand }}" hint-placeholder-val="{{ true }}">
    <a href="{{ ln.main }}" aria-label="VocaLab – Hôm nay" style="display: flex; align-items: center; gap: 10px; padding: 0 6px; text-decoration: none; color: #1C1C22">
      <span style="width: 40px; height: 40px; border-radius: 8px; background: #3F4C9A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 16px">V</span>
      <sc-if value="{{ full }}" hint-placeholder-val="{{ true }}">
        <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.02em">VocaLab</span>
      </sc-if>
    </a>
  </sc-if>

  <sc-if value="{{ full }}" hint-placeholder-val="{{ true }}">
    <a href="{{ ln.add }}" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 10px; background: #3F4C9A; color: #FFFFFF; font-weight: 700; font-size: 15px; text-decoration: none">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      Thêm từ mới
    </a>
  </sc-if>
  <sc-if value="{{ rail }}" hint-placeholder-val="{{ false }}">
    <a href="{{ ln.add }}" aria-label="Thêm từ mới" style="width: 56px; height: 56px; border-radius: 12px; background: #3F4C9A; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
  </sc-if>

  <div style="{{ groupStyle }}">
    <a href="{{ ln.main }}" style="{{ s.main }}">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
      <span>Hôm nay</span>
    </a>
    <a href="{{ ln.vocab }}" style="{{ s.vocab }}">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="5" height="16" rx="1.5"></rect><rect x="10" y="4" width="5" height="16" rx="1.5"></rect><path d="M17.5 5.2l3.3 14.4"></path></svg>
      <span>Thư viện</span>
    </a>
    <sc-if value="{{ bar }}" hint-placeholder-val="{{ false }}">
      <a href="{{ ln.add }}" aria-label="Thêm từ mới" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 60px; text-decoration: none; color: #3F4C9A; font-size: 12px; font-weight: 700">
        <span style="width: 48px; height: 36px; border-radius: 10px; background: #3F4C9A; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>
        Thêm từ
      </a>
    </sc-if>
    <a href="{{ ln.practice }}" style="{{ s.practice }}">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="13" height="14" rx="2.5"></rect><path d="M8 3h10.5A2.5 2.5 0 0 1 21 5.5V16"></path></svg>
      <span>Luyện tập</span>
    </a>
    <a href="{{ ln.settings }}" style="{{ s.settings }}">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
      <span>Cài đặt</span>
    </a>
  </div>

  <sc-if value="{{ full }}" hint-placeholder-val="{{ true }}">
    <div style="margin-top: auto; border: 1px solid #E6E5E0; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 36px; height: 36px; border-radius: 8px; background: #F8EDE4; color: #B9532A; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.5 1.2-4 2.5-5 .2 1.8 1 3 2.5 3.5C11 8.5 11 5 12 2z"></path></svg></span>
        <div style="display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 15px">Chuỗi 12 ngày</span><span style="font-size: 13px; color: #63636E">Ôn hôm nay để giữ chuỗi</span></div>
      </div>
    </div>
  </sc-if>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["main","vocab","practice","settings","add"],"default":"main"},"device":{"editor":"enum","options":["laptop","ipad","iphone"],"default":"laptop"},"$preview":{"width":240,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'main';
    const d = this.props.device ?? 'laptop';
    const full = d === 'laptop', rail = d === 'ipad', bar = d === 'iphone';
    const sfx = full ? '' : rail ? 'Tablet' : 'Phone';
    const ln = { main: 'Main' + sfx + '.dc.html', vocab: 'Vocab' + sfx + '.dc.html', add: 'AddWord' + sfx + '.dc.html', practice: 'PracticeSetup' + sfx + '.dc.html', settings: 'Settings' + sfx + '.dc.html' };
    const font = { fontFamily: 'Inter, system-ui, sans-serif', color: '#1C1C22', background: '#FFFFFF', boxSizing: 'border-box' };
    const navStyle = full
      ? { ...font, width: '100%', minHeight: '100%', borderRight: '1px solid #E6E5E0', padding: '24px 16px', display: 'flex', flexDirection: 'column', gap: '20px' }
      : rail
        ? { ...font, width: '88px', minHeight: '100%', borderRight: '1px solid #E6E5E0', padding: '20px 8px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '20px' }
        : { ...font, width: '100%', borderTop: '1px solid #E6E5E0', padding: '6px 8px 26px', boxShadow: '0 -4px 16px rgba(28,28,34,0.04)' };
    const groupStyle = full
      ? { display: 'flex', flexDirection: 'column', gap: '4px' }
      : rail
        ? { display: 'flex', flexDirection: 'column', gap: '8px', width: '100%' }
        : { display: 'grid', gridTemplateColumns: 'repeat(5, minmax(0, 1fr))', gap: '2px', width: '100%' };
    const baseFull = { display: 'flex', alignItems: 'center', gap: '12px', padding: '0 14px', minHeight: '46px', borderRadius: '10px', textDecoration: 'none', fontSize: '15px', fontWeight: 600, color: '#63636E', background: 'transparent' };
    const baseCompact = { display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: '4px', minHeight: '60px', padding: '6px 2px', borderRadius: '10px', textDecoration: 'none', fontSize: '12px', fontWeight: 600, textAlign: 'center', lineHeight: 1.2, color: '#63636E', background: 'transparent' };
    const pick = (k) => {
      const on = k === active;
      const b = full ? baseFull : baseCompact;
      return on ? { ...b, background: '#ECEEF8', color: '#2E3A80', fontWeight: 700 } : b;
    };
    return { navStyle, groupStyle, full, rail, bar, showBrand: !bar, ln,
      s: { main: pick('main'), vocab: pick('vocab'), practice: pick('practice'), settings: pick('settings') } };
  }
}
</script>
</body>
</html>
