<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Hình minh hoạ từ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="width: 100%; height: 100%; min-height: 120px; background: #F6F0E1; overflow: hidden">
  <sc-if value="{{ is.meticulous }}" hint-placeholder-val="{{ false }}">
    <svg role="img" aria-label="Minh hoạ: soi kính lúp kiểm tra từng mục" viewBox="0 0 240 180" preserveAspectRatio="xMidYMid slice" style="width: 100%; height: 100%; display: block">
      <rect width="240" height="180" fill="#F6F0E1"></rect>
      <rect x="66" y="22" width="100" height="136" rx="8" fill="#FFFFFF" stroke="#1C1C22" stroke-width="3"></rect>
      <rect x="96" y="14" width="40" height="16" rx="5" fill="#3F4C9A"></rect>
      <rect x="80" y="50" width="12" height="12" rx="3" fill="none" stroke="#1C1C22" stroke-width="2.5"></rect><path d="M83 56l3 3 5-6" fill="none" stroke="#2F7A55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path><path d="M100 56h50" stroke="#D3D2CB" stroke-width="5" stroke-linecap="round"></path>
      <rect x="80" y="78" width="12" height="12" rx="3" fill="none" stroke="#1C1C22" stroke-width="2.5"></rect><path d="M83 84l3 3 5-6" fill="none" stroke="#2F7A55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path><path d="M100 84h40" stroke="#D3D2CB" stroke-width="5" stroke-linecap="round"></path>
      <rect x="80" y="106" width="12" height="12" rx="3" fill="none" stroke="#1C1C22" stroke-width="2.5"></rect><path d="M100 112h46" stroke="#D3D2CB" stroke-width="5" stroke-linecap="round"></path>
      <circle cx="160" cy="118" r="26" fill="#ECEEF8" fill-opacity="0.9" stroke="#3F4C9A" stroke-width="6"></circle>
      <path d="M152 118l5 5 10-11" fill="none" stroke="#3F4C9A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M179 137l20 20" stroke="#1C1C22" stroke-width="10" stroke-linecap="round"></path>
    </svg>
  </sc-if>
  <sc-if value="{{ is.ubiquitous }}" hint-placeholder-val="{{ false }}">
    <svg role="img" aria-label="Minh hoạ: điện thoại xuất hiện khắp quả địa cầu" viewBox="0 0 240 180" preserveAspectRatio="xMidYMid slice" style="width: 100%; height: 100%; display: block">
      <rect width="240" height="180" fill="#E5F0EF"></rect>
      <circle cx="120" cy="92" r="58" fill="#FFFFFF" stroke="#2C625E" stroke-width="3"></circle>
      <path d="M62 92h116M120 34c-22 20-22 96 0 116M120 34c22 20 22 96 0 116" fill="none" stroke="#9CC3BF" stroke-width="2.5"></path>
      <rect x="88" y="58" width="16" height="26" rx="3" fill="#3F4C9A"></rect>
      <rect x="132" y="70" width="16" height="26" rx="3" fill="#3F4C9A"></rect>
      <rect x="104" y="104" width="16" height="26" rx="3" fill="#3F4C9A"></rect>
      <rect x="28" y="40" width="14" height="22" rx="3" fill="#1C1C22"></rect>
      <rect x="196" y="36" width="14" height="22" rx="3" fill="#1C1C22"></rect>
      <rect x="200" y="122" width="14" height="22" rx="3" fill="#1C1C22"></rect>
      <rect x="22" y="128" width="14" height="22" rx="3" fill="#1C1C22"></rect>
    </svg>
  </sc-if>
  <sc-if value="{{ is.reluctant }}" hint-placeholder-val="{{ false }}">
    <svg role="img" aria-label="Minh hoạ: người ngập ngừng, giơ tay từ chối bước tới" viewBox="0 0 240 180" preserveAspectRatio="xMidYMid slice" style="width: 100%; height: 100%; display: block">
      <rect width="240" height="180" fill="#F8EDE4"></rect>
      <path d="M40 150h160" stroke="#D9C7B6" stroke-width="4" stroke-linecap="round"></path>
      <path d="M150 120h44" stroke="#B9532A" stroke-width="4" stroke-dasharray="6 6" stroke-linecap="round"></path>
      <path d="M186 112l10 8-10 8" fill="none" stroke="#B9532A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
      <circle cx="104" cy="52" r="16" fill="#1C1C22"></circle>
      <path d="M100 70c-6 20-10 40-12 60" stroke="#1C1C22" stroke-width="10" stroke-linecap="round"></path>
      <path d="M88 130l-12 20M88 130l14 20" stroke="#1C1C22" stroke-width="8" stroke-linecap="round"></path>
      <path d="M98 84l30-10" stroke="#1C1C22" stroke-width="7" stroke-linecap="round"></path>
      <rect x="126" y="62" width="10" height="18" rx="4" fill="#1C1C22"></rect>
      <path d="M128 32c10-10 30-8 34 4" fill="none" stroke="#94461F" stroke-width="3" stroke-linecap="round"></path>
      <circle cx="166" cy="42" r="3" fill="#94461F"></circle><circle cx="176" cy="40" r="3" fill="#94461F"></circle><circle cx="186" cy="38" r="3" fill="#94461F"></circle>
    </svg>
  </sc-if>
  <sc-if value="{{ is.albeit }}" hint-placeholder-val="{{ false }}">
    <svg role="img" aria-label="Minh hoạ: mặt trời tốt đẹp nhưng bị một đám mây che bớt" viewBox="0 0 240 180" preserveAspectRatio="xMidYMid slice" style="width: 100%; height: 100%; display: block">
      <rect width="240" height="180" fill="#ECEEF8"></rect>
      <circle cx="110" cy="80" r="38" fill="#F2C14E"></circle>
      <path d="M110 22v14M110 124v14M52 80h14M154 80h14M69 39l10 10M141 111l10 10M69 121l10-10" stroke="#E0A92A" stroke-width="5" stroke-linecap="round"></path>
      <path d="M118 128c-18 0-26-12-20-24 4-10 16-14 26-8 6-14 30-16 38 0 16-2 24 10 20 22-2 6-8 10-16 10z" fill="#FFFFFF" stroke="#3F4C9A" stroke-width="3"></path>
    </svg>
  </sc-if>
  <sc-if value="{{ is.scrutinize }}" hint-placeholder-val="{{ false }}">
    <svg role="img" aria-label="Minh hoạ: con mắt và kính lúp soi kỹ văn bản" viewBox="0 0 240 180" preserveAspectRatio="xMidYMid slice" style="width: 100%; height: 100%; display: block">
      <rect width="240" height="180" fill="#F1ECF6"></rect>
      <rect x="40" y="30" width="110" height="130" rx="8" fill="#FFFFFF" stroke="#1C1C22" stroke-width="3"></rect>
      <path d="M56 56h70M56 76h78M56 96h60M56 116h74M56 136h50" stroke="#D3D2CB" stroke-width="5" stroke-linecap="round"></path>
      <circle cx="150" cy="96" r="34" fill="#FFFFFF" fill-opacity="0.85" stroke="#5E3F87" stroke-width="6"></circle>
      <path d="M128 96c8-12 36-12 44 0-8 12-36 12-44 0z" fill="none" stroke="#1C1C22" stroke-width="3"></path>
      <circle cx="150" cy="96" r="7" fill="#1C1C22"></circle>
      <path d="M174 120l26 26" stroke="#1C1C22" stroke-width="11" stroke-linecap="round"></path>
    </svg>
  </sc-if>
  <sc-if value="{{ generic }}" hint-placeholder-val="{{ true }}">
    <svg role="img" aria-label="Chưa có hình minh hoạ" viewBox="0 0 240 180" preserveAspectRatio="xMidYMid slice" style="width: 100%; height: 100%; display: block">
      <rect width="240" height="180" fill="#EFEEEA"></rect>
      <rect x="90" y="62" width="60" height="48" rx="6" fill="none" stroke="#A9A8A0" stroke-width="3"></rect>
      <circle cx="106" cy="80" r="6" fill="#A9A8A0"></circle>
      <path d="M150 104l-18-16-24 20" fill="none" stroke="#A9A8A0" stroke-width="3" stroke-linejoin="round"></path>
    </svg>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"word":{"editor":"enum","options":["meticulous","ubiquitous","reluctant","albeit","scrutinize"],"default":"meticulous"},"$preview":{"width":240,"height":180}}'>
class Component extends DCLogic {
  renderVals() {
    const w = this.props.word ?? 'meticulous';
    const ids = ['meticulous', 'ubiquitous', 'reluctant', 'albeit', 'scrutinize'];
    const is = {}; ids.forEach((k) => { is[k] = w === k; });
    return { is, generic: !ids.includes(w) };
  }
}
</script>
</body>
</html>
