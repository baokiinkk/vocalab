<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Kết quả phiên</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F6F4}
a{color:#3F4C9A}a:hover{color:#2E3A80}
</style>
</helmet>
<div style="{{ L.root }}">
  <main style="{{ L.main }}">
    <div style="max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; justify-content: flex-end">
        <a href="{{ ln.home }}" aria-label="Đóng" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E6E5E0; color: #1C1C22; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
      </div>

      <section style="background: #FFFFFF; border: 1px solid #E6E5E0; border-radius: 16px; padding: 28px 22px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
        <div role="img" aria-label="Đúng 20 trên 24 câu, 83%" style="width: 140px; height: 140px; border-radius: 999px; background: conic-gradient(#2F7A55 0 83%, #EFEEEA 83% 100%); display: flex; align-items: center; justify-content: center">
          <div style="width: 112px; height: 112px; border-radius: 999px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 34px; font-weight: 800; letter-spacing: -0.02em">83%</span><span style="font-size: 13px; color: #63636E">20/24 đúng</span></div>
        </div>
        <h1 style="{{ L.h1 }}">Xong phiên hôm nay!</h1>
        <span style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 8px; background: #F8EDE4; color: #94461F; font-size: 14px; font-weight: 700"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.5 1.2-4 2.5-5 .2 1.8 1 3 2.5 3.5C11 8.5 11 5 12 2z"></path></svg>Chuỗi 13 ngày</span>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%">
          <div style="padding: 12px 8px; border-radius: 10px; background: #F6F6F4; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 800">9′</span><span style="font-size: 12px; color: #63636E">thời gian</span></div>
          <div style="padding: 12px 8px; border-radius: 10px; background: #F6F6F4; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 800">58→61%</span><span style="font-size: 12px; color: #63636E">thông thạo TB</span></div>
          <div style="padding: 12px 8px; border-radius: 10px; background: #F6F6F4; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 800">+2</span><span style="font-size: 12px; color: #63636E">từ đạt 100%</span></div>
        </div>
      </section>

      <section style="background: #FFFFFF; border: 1px solid #E6E5E0; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap">
          <h2 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 800">Thay đổi từng từ</h2>
          <div role="tablist" aria-label="Lọc kết quả" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 8px; background: #ECEBE6">
            <button type="button" role="tab" aria-selected="{{ allSel }}" onClick="{{ showAll }}" style="{{ segAll }}">Tất cả · 24</button>
            <button type="button" role="tab" aria-selected="{{ wrongSel }}" onClick="{{ showWrong }}" style="{{ segWrong }}">Sai · 4</button>
          </div>
        </div>
        <div style="display: flex; flex-direction: column">
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
            <a href="{{ ln.word }}" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 0; border-bottom: 1px solid #EFEEEA; text-decoration: none; color: #1C1C22">
              <span style="{{ r.dot }}">{{ r.mark }}</span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><strong style="font-size: 15px">{{ r.w }}</strong><span style="font-size: 13px; color: #63636E">{{ r.mode }}</span></span>
              <span style="display: flex; flex-direction: column; align-items: flex-end"><span style="{{ r.delta }}">{{ r.change }}</span><span style="font-size: 13px; color: #63636E">{{ r.range }}</span></span>
            </a>
          </sc-for>
        </div>
      </section>
    </div>
  </main>
  <footer style="{{ L.bottom }}">
    <a href="{{ ln.home }}" style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 10px; border: 1px solid #E6E5E0; background: #FFFFFF; color: #1C1C22; font-size: 15px; font-weight: 700; text-decoration: none">Về trang chủ</a>
    <a href="{{ ln.flash }}" style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 10px; background: #3F4C9A; color: #FFFFFF; font-size: 15px; font-weight: 800; text-decoration: none">Ôn lại 4 từ sai</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"device":{"editor":"enum","options":["laptop","ipad","iphone"],"default":"laptop"},"frameH":{"editor":null},"$preview":{"width":1440,"height":980}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 'all' }; }
  layout() {
    const d = this.props.device ?? 'laptop';
    const laptop = d === 'laptop', tablet = d === 'ipad', phone = d === 'iphone';
    const fh = this.props.frameH ?? (tablet ? 1180 : 844);
    const ink = { background: '#F6F6F4', fontFamily: 'Inter, system-ui, sans-serif', color: '#1C1C22', display: 'flex', flexDirection: 'column' };
    const px = laptop ? '40px' : tablet ? '32px' : '16px';
    return { d, sfx: laptop ? '' : tablet ? 'Tablet' : 'Phone', L: {
      root: laptop ? { ...ink, minHeight: '100vh' } : { ...ink, width: '100%', minHeight: fh + 'px' },
      main: { flex: '1 1 auto', padding: (phone ? '14px ' : '24px ') + px + ' 12px', boxSizing: 'border-box' },
      bottom: { display: 'flex', gap: '12px', padding: (phone ? '12px ' + px + ' 30px' : '16px ' + px + ' 40px'), maxWidth: '800px', width: '100%', margin: '0 auto', boxSizing: 'border-box' },
      h1: { margin: 0, fontFamily: "'Plus Jakarta Sans', sans-serif", fontSize: phone ? '26px' : '30px', fontWeight: 800, letterSpacing: '-0.02em' }
    } };
  }
  renderVals() {
    const { d, sfx, L } = this.layout();
    const s = this.state;
    const seg = (on) => ({ minHeight: '36px', padding: '0 12px', borderRadius: '6px', border: 'none', background: on ? '#FFFFFF' : 'transparent', color: on ? '#1C1C22' : '#63636E', font: 'inherit', fontSize: '13px', fontWeight: 700, cursor: 'pointer', boxShadow: on ? '0 1px 3px rgba(28,28,34,0.12)' : 'none', whiteSpace: 'nowrap' });
    const data = [
      ['negotiate', 'Chọn nghĩa', true, 90, 100], ['deadline', 'Flashcard', true, 90, 100],
      ['reluctant', 'Chọn nghĩa', false, 30, 10], ['albeit', 'Chọn nghĩa', false, 0, 0],
      ['ubiquitous', 'Flashcard', true, 20, 30], ['meticulous', 'Điền chỗ trống', false, 10, 0],
      ['appreciate', 'Flashcard', true, 50, 60], ['scrutinize', 'Chọn nghĩa', false, 20, 0]
    ];
    const rows = data.filter((r) => s.filter === 'all' || !r[2]).map(([w, mode, ok, a, b]) => ({ w, mode, mark: ok ? '✓' : '✕',
      change: (b - a >= 0 ? '+' : '−') + Math.abs(b - a) + '%', range: a + '% → ' + b + '%' + (b === 100 ? ' · thành thạo' : ''),
      dot: { flex: '0 0 32px', width: '32px', height: '32px', borderRadius: '999px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800, fontSize: '14px', background: ok ? '#E7F2EC' : '#F8E9E7', color: ok ? '#2A6B4B' : '#8E2A22' },
      delta: { fontSize: '15px', fontWeight: 800, color: ok ? '#2F7A55' : '#B23A30' } }));
    return { device: d, L, rows,
      allSel: String(s.filter === 'all'), wrongSel: String(s.filter === 'wrong'),
      showAll: () => this.setState({ filter: 'all' }), showWrong: () => this.setState({ filter: 'wrong' }),
      segAll: seg(s.filter === 'all'), segWrong: seg(s.filter === 'wrong'),
      ln: { home: 'Main' + sfx + '.dc.html', flash: 'Flashcard' + sfx + '.dc.html', word: 'WordDetail' + sfx + '.dc.html' } };
  }
}
</script>
</body>
</html>
