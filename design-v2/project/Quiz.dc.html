<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Luyện tập · Chọn nghĩa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F6F4}
a{color:#3F4C9A}a:hover{color:#2E3A80}
</style>
</helmet>
<div style="{{ L.root }}">
  <header style="{{ L.top }}">
    <a href="{{ ln.home }}" aria-label="Thoát phiên luyện" style="flex: 0 0 auto; width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E6E5E0; color: #1C1C22; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
      <div style="display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700"><span>Chọn nghĩa</span><span style="color: #63636E">{{ progress }}</span></div>
      <div role="progressbar" aria-label="Tiến độ phiên" aria-valuemin="0" aria-valuemax="24" aria-valuenow="{{ step }}" style="height: 8px; border-radius: 999px; background: #E6E5E0; overflow: hidden"><div style="{{ progBar }}"></div></div>
    </div>
  </header>

  <main style="{{ L.main }}">
    <div style="max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px">
      <sc-if value="{{ detail }}" hint-placeholder-val="{{ false }}">
        <section aria-label="Chi tiết từ vừa trả lời đúng" style="background: #FFFFFF; border: 1px solid #E6E5E0; border-radius: 16px; overflow: hidden; box-shadow: 0 14px 36px rgba(28,28,34,0.08)">
          <div style="height: 4px; background: #EFEEEA"><div style="{{ cdBar }}"></div></div>
          <div style="{{ L.illo }}"><dc-import name="Illo" word="{{ q.w }}" hint-size="100%,100%"></dc-import></div>
          <div style="padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 10px">
            <span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px; background: #E7F2EC; color: #2A6B4B; font-size: 13px; font-weight: 800">✓ Chính xác · +10% · {{ masteryText }}</span>
            <div style="display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px"><span style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">{{ q.w }}</span><span style="font-size: 15px; color: #63636E">{{ q.ipa }}</span></div>
            <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 800; color: #2E3A80">{{ q.vi }}</span>
            <span style="padding: 10px 12px; border-radius: 10px; background: #F6F6F4; font-size: 15px; line-height: 1.5">{{ q.ex }}</span>
            <div style="display: flex; gap: 10px; padding-top: 4px">
              <a href="{{ ln.word }}" style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 10px; border: 1px solid #E6E5E0; color: #1C1C22; font-size: 14px; font-weight: 700; text-decoration: none">Xem chi tiết</a>
              <button type="button" onClick="{{ next }}" style="flex: 1; min-height: 48px; border-radius: 10px; border: none; background: #3F4C9A; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer">{{ nextLabel }}</button>
            </div>
            <span style="font-size: 12px; color: #63636E; text-align: center">Tự chuyển câu sau 3 giây</span>
          </div>
        </section>
      </sc-if>
      <sc-if value="{{ notDetail }}" hint-placeholder-val="{{ true }}">
      <section style="background: #FFFFFF; border: 1px solid #E6E5E0; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
        <span style="{{ lvTag }}">{{ lvText }}</span>
        <span style="font-size: 14px; font-weight: 600; color: #63636E">Từ này nghĩa là gì?</span>
        <h1 style="{{ L.word }}">{{ q.w }}</h1>
        <button type="button" aria-label="Nghe phát âm" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #E6E5E0; background: #FFFFFF; color: #1C1C22; font: inherit; font-size: 15px; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3F4C9A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10z"></path><path d="M16 9a4 4 0 0 1 0 6"></path></svg>{{ q.ipa }}</button>
      </section>

      <div role="group" aria-label="Các đáp án" style="display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{ opts }}" as="o" hint-placeholder-count="4">
          <button type="button" onClick="{{ o.pick }}" disabled="{{ o.disabled }}" style="{{ o.style }}">
            <span style="{{ o.badge }}">{{ o.badgeText }}</span>
            <span style="flex: 1; text-align: left">{{ o.text }}</span>
            <span style="font-size: 13px; font-weight: 800">{{ o.verdict }}</span>
          </button>
        </sc-for>
      </div>

      </sc-if>
      <sc-if value="{{ wrongShown }}" hint-placeholder-val="{{ false }}">
        <div role="status" style="{{ fbStyle }}">
          <span style="font-weight: 800; font-size: 15px">{{ fbTitle }}</span>
          <span style="display: flex; align-items: center; gap: 10px"><span style="flex: 1; height: 8px; border-radius: 999px; background: #FFFFFF; overflow: hidden; display: block"><span style="{{ mBar }}"></span></span><strong>{{ masteryText }}</strong></span>
          <span style="font-size: 14px; line-height: 1.5; color: #1C1C22">“{{ q.ex }}”</span>
        </div>
      </sc-if>
    </div>
  </main>

  <footer style="{{ L.bottom }}">
    <sc-if value="{{ notAnswered }}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{ skip }}" style="flex: 1; min-height: 56px; border-radius: 10px; border: 1px solid #E6E5E0; background: #FFFFFF; color: #63636E; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Tôi không biết</button>
    </sc-if>
    <sc-if value="{{ canNextW }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ next }}" style="flex: 1; min-height: 56px; border-radius: 10px; border: none; background: #3F4C9A; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer">Câu tiếp theo</button>
    </sc-if>
    <sc-if value="{{ isLastW }}" hint-placeholder-val="{{ false }}">
      <a href="{{ ln.result }}" style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 10px; background: #3F4C9A; color: #FFFFFF; font-size: 16px; font-weight: 800; text-decoration: none">Xem kết quả</a>
    </sc-if>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"device":{"editor":"enum","options":["laptop","ipad","iphone"],"default":"laptop"},"frameH":{"editor":null},"demoDetail":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.qs = [
      { w: 'reluctant', vi: 'miễn cưỡng, không sẵn lòng', ipa: '/rɪˈlʌktənt/', p: 30, ans: 1, opts: ['hào hứng, sẵn sàng', 'miễn cưỡng, không sẵn lòng', 'kiên nhẫn', 'bất cẩn'], ex: 'He was reluctant to admit his mistake.' },
      { w: 'albeit', vi: 'mặc dù, dẫu cho', ipa: '/ɔːlˈbiːɪt/', p: 0, ans: 2, opts: ['vì vậy', 'ngay lập tức', 'mặc dù, dẫu cho', 'hơn nữa'], ex: 'It was a good result, albeit a little late.' },
      { w: 'scrutinize', vi: 'xem xét kỹ lưỡng', ipa: '/ˈskruːtənaɪz/', p: 20, ans: 0, opts: ['xem xét kỹ lưỡng', 'bỏ qua', 'tóm tắt', 'phóng đại'], ex: 'The committee will scrutinize every proposal.' }
    ];
    this.state = props.demoDetail ? { i: 0, pick: 1, detail: true, cd: false, hold: true } : { i: 0, pick: null, detail: false, cd: false };
  }
  componentWillUnmount() { clearTimeout(this.t1); clearTimeout(this.t2); }
  goNext() { clearTimeout(this.t1); clearTimeout(this.t2); const s = this.state; if (s.i < this.qs.length - 1) this.setState({ i: s.i + 1, pick: null, detail: false, cd: false }); else this.setState({ detail: false, done: true }); }
  choose(j) {
    const s = this.state; const q = this.qs[s.i];
    if (j === q.ans) { this.setState({ pick: j, detail: true, cd: false }); this.t2 = setTimeout(() => this.setState({ cd: true }), 40); this.t1 = setTimeout(() => this.goNext(), 3500); }
    else this.setState({ pick: j });
  }
  layout() {
    const d = this.props.device ?? 'laptop';
    const laptop = d === 'laptop', tablet = d === 'ipad', phone = d === 'iphone';
    const fh = this.props.frameH ?? (tablet ? 1180 : 844);
    const ink = { background: '#F6F6F4', fontFamily: 'Inter, system-ui, sans-serif', color: '#1C1C22', display: 'flex', flexDirection: 'column' };
    const px = laptop ? '40px' : tablet ? '32px' : '16px';
    return { d, phone, sfx: laptop ? '' : tablet ? 'Tablet' : 'Phone', L: {
      root: laptop ? { ...ink, minHeight: '100vh' } : { ...ink, width: '100%', minHeight: fh + 'px' },
      top: { display: 'flex', alignItems: 'center', gap: '14px', padding: (phone ? '14px ' : '24px ') + px, maxWidth: '720px', width: '100%', margin: '0 auto', boxSizing: 'border-box' },
      main: { flex: '1 1 auto', padding: '4px ' + px + ' 12px', boxSizing: 'border-box' },
      illo: { height: phone ? '200px' : '240px' },
      bottom: { display: 'flex', gap: '12px', padding: (phone ? '12px ' + px + ' 30px' : '16px ' + px + ' 40px'), maxWidth: '720px', width: '100%', margin: '0 auto', boxSizing: 'border-box' },
      word: { margin: 0, fontFamily: "'Plus Jakarta Sans', sans-serif", fontSize: phone ? '40px' : '52px', fontWeight: 800, letterSpacing: '-0.03em', lineHeight: 1.05 }
    } };
  }
  renderVals() {
    const { d, sfx, L } = this.layout();
    const s = this.state;
    const q = this.qs[s.i];
    const last = s.i === this.qs.length - 1;
    const answered = s.pick !== null;
    const ok = answered && s.pick === q.ans;
    const color = (p) => p >= 100 ? '#2F7A55' : p >= 70 ? '#3F4C9A' : p >= 30 ? '#9A6A12' : '#B9532A';
    const label = (p) => p >= 100 ? 'Thành thạo' : p >= 70 ? 'Khá' : p >= 30 ? 'Đang học' : 'Yếu';
    const after = answered ? (ok ? Math.min(100, q.p + 10) : Math.max(0, q.p - 20)) : q.p;
    const step = 15 + s.i;
    const opts = q.opts.map((text, j) => {
      const isAns = j === q.ans, isPick = j === s.pick;
      const state = !answered ? 'idle' : isAns ? 'right' : isPick ? 'wrong' : 'dim';
      const bg = { idle: '#FFFFFF', right: '#E7F2EC', wrong: '#F8E9E7', dim: '#FFFFFF' }[state];
      const bd = { idle: '1.5px solid #E6E5E0', right: '2px solid #2F7A55', wrong: '2px solid #B23A30', dim: '1.5px solid #E6E5E0' }[state];
      return { text, badgeText: 'ABCD'[j], disabled: answered,
        verdict: state === 'right' ? '✓ Đúng' : state === 'wrong' ? '✕ Sai' : '',
        pick: () => { if (!answered) this.choose(j); },
        style: { display: 'flex', alignItems: 'center', gap: '14px', minHeight: '64px', padding: '10px 16px', borderRadius: '12px', border: bd, background: bg, color: state === 'wrong' ? '#8E2A22' : state === 'right' ? '#2A6B4B' : '#1C1C22', opacity: state === 'dim' ? 0.55 : 1, font: 'inherit', fontSize: '16px', fontWeight: 600, cursor: answered ? 'default' : 'pointer', boxSizing: 'border-box', width: '100%' },
        badge: { flex: '0 0 32px', height: '32px', borderRadius: '8px', background: state === 'right' ? '#2F7A55' : state === 'wrong' ? '#B23A30' : '#F6F6F4', color: state === 'right' || state === 'wrong' ? '#FFFFFF' : '#63636E', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '14px', fontWeight: 800 } };
    });
    return {
      device: d, L, q, opts, answered, notAnswered: !answered,
      ln: { home: 'Main' + sfx + '.dc.html', result: 'Result' + sfx + '.dc.html', word: 'WordDetail' + sfx + '.dc.html' },
      progress: step + ' / 24', step,
      progBar: { width: (step / 24 * 100) + '%', height: '100%', background: '#3F4C9A', borderRadius: '999px' },
      lvTag: { padding: '4px 10px', borderRadius: '8px', background: '#F6F6F4', color: color(q.p), fontSize: '13px', fontWeight: 800 },
      lvText: label(q.p) + ' · ' + q.p + '%',
      fbStyle: { display: 'flex', flexDirection: 'column', gap: '10px', padding: '16px', borderRadius: '12px', background: ok ? '#E7F2EC' : '#F8E9E7', color: ok ? '#2A6B4B' : '#8E2A22', fontSize: '14px' },
      fbTitle: ok ? 'Chính xác · +10%' : 'Chưa đúng · −20% · từ này sẽ xuất hiện nhiều hơn',
      mBar: { display: 'block', width: Math.max(after, 3) + '%', height: '100%', background: ok ? '#2F7A55' : '#B23A30', borderRadius: '999px', transition: 'width 400ms ease' },
      masteryText: q.p + '% → ' + after + '%',
      skip: () => this.setState({ pick: -1 }),
      detail: !!s.detail, notDetail: !s.detail, wrongShown: answered && !ok,
      canNextW: answered && !ok && !last, isLastW: (answered && !ok && last) || !!s.done,
      nextLabel: last ? 'Xem kết quả' : 'Tiếp ngay',
      cdBar: { height: '100%', background: '#2F7A55', width: s.cd ? '0%' : '100%', transition: s.cd ? 'width 3400ms linear' : 'none' },
      canNext: answered && !last, isLast: answered && last,
      next: () => { if (last && s.detail) { this.setState({ detail: false, done: true }); } else this.goNext(); }
    };
  }
}
</script>
</body>
</html>
