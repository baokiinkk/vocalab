<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Điều hướng</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Điều hướng chính" style="{{ navStyle }}">
  <sc-if value="{{ full }}" hint-placeholder-val="{{ true }}">
    <a href="{{ ln.main }}" aria-label="VocaLab – Hôm nay" style="display: flex; align-items: center; gap: 10px; padding: 4px 6px 14px; text-decoration: none; color: #2E2A24">
      <span style="width: 38px; height: 38px; border-radius: 12px; background: #CF4822; color: #FFFDF8; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; box-shadow: 0 3px 0 #A83A1A">V</span>
      <span style="display: flex; flex-direction: column; line-height: 1.1"><b style="font-size: 18px; font-weight: 800; letter-spacing: -0.01em">VocaLab</b><span style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #8A8378">ENGLISH</span></span>
    </a>
  </sc-if>
  <sc-if value="{{ rail }}" hint-placeholder-val="{{ false }}">
    <a href="{{ ln.main }}" aria-label="VocaLab – Hôm nay" style="width: 42px; height: 42px; border-radius: 13px; background: #CF4822; color: #FFFDF8; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; text-decoration: none; margin-bottom: 8px; box-shadow: 0 3px 0 #A83A1A">V</a>
  </sc-if>

  <div style="{{ groupStyle }}">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
      <a href="{{ it.href }}" aria-current="{{ it.cur }}" style="{{ it.style }}">
        <span style="{{ it.tile }}"><sc-if value="{{ it.is.main }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="{{ it.ic }}" height="{{ it.ic }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ it.sw }}" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5L12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"></path></svg></sc-if><sc-if value="{{ it.is.vocab }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="{{ it.ic }}" height="{{ it.ic }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ it.sw }}" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h14v15H6a2 2 0 0 0-2 2 1.5 1.5 0 0 0 1.5 1.5H20"></path></svg></sc-if><sc-if value="{{ it.is.add }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="{{ it.ic }}" height="{{ it.ic }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ it.sw }}" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg></sc-if><sc-if value="{{ it.is.practice }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="{{ it.ic }}" height="{{ it.ic }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ it.sw }}" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="13" height="14" rx="3"></rect><path d="M8 3h10a3 3 0 0 1 3 3v10"></path></svg></sc-if><sc-if value="{{ it.is.settings }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="{{ it.ic }}" height="{{ it.ic }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ it.sw }}" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></sc-if></span>
        <span>{{ it.label }}</span>
      </a>
    </sc-for>
  </div>

  <sc-if value="{{ full }}" hint-placeholder-val="{{ true }}">
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 16px; background: #FFFDF8; border: 1px solid #E8DFCC; box-shadow: 0 2px 0 #E8DFCC">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 38px; height: 38px; border-radius: 999px; background: #D9EFE0; color: #2F7A4F; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; border: 2px solid #FFFDF8; box-shadow: 0 0 0 1.5px #BFDCC9">TH</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><b style="font-size: 14px">Thu Hà</b><span style="font-size: 12px; color: #8A8378; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Mục tiêu IELTS 6.5</span></span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
        <div style="padding: 8px; border-radius: 10px; background: #FBF7F0; display: flex; flex-direction: column"><b style="font-size: 16px; color: #C2465E">12</b><span style="font-size: 11px; color: #8A8378">ngày liên tiếp</span></div>
        <div style="padding: 8px; border-radius: 10px; background: #FBF7F0; display: flex; flex-direction: column"><b style="font-size: 16px; color: #CF4822">248</b><span style="font-size: 11px; color: #8A8378">từ đã học</span></div>
      </div>
    </div>
  </sc-if>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["main","vocab","add","practice","settings"],"default":"main"},"device":{"editor":"enum","options":["laptop","ipad","iphone"],"default":"laptop"},"$preview":{"width":240,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'main';
    const d = this.props.device ?? 'laptop';
    const full = d === 'laptop', rail = d === 'ipad', bar = d === 'iphone';
    const sfx = full ? '' : rail ? 'Tablet' : 'Phone';
    const font = { fontFamily: "'Be Vietnam Pro', Inter, system-ui, sans-serif", color: '#2E2A24', boxSizing: 'border-box' };
    const navStyle = full
      ? { ...font, width: '100%', minHeight: '100%', background: '#F6F0E4', borderRight: '1px solid #E8DFCC', padding: '20px 14px', display: 'flex', flexDirection: 'column', gap: '8px' }
      : rail
        ? { ...font, width: '88px', minHeight: '100%', background: '#F6F0E4', borderRight: '1px solid #E8DFCC', padding: '18px 8px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '6px' }
        : { ...font, width: '100%', position: 'sticky', bottom: 0, zIndex: 20, background: '#FFFDF8', borderTop: '1px solid #E8DFCC', boxShadow: '0 -6px 18px rgba(46,42,36,0.06)', padding: '8px 6px 26px' };
    const groupStyle = full
      ? { display: 'flex', flexDirection: 'column', gap: '4px' }
      : rail
        ? { display: 'flex', flexDirection: 'column', gap: '6px', width: '100%' }
        : { display: 'grid', gridTemplateColumns: 'repeat(5, minmax(0, 1fr))', width: '100%' };
    const defs = [
      ['main', 'Hôm nay', '⌂', '#FFE3D3', '#B5501F', 'Main'],
      ['vocab', 'Thư viện', 'Aa', '#E6DEFF', '#5B40C9', 'Vocab'],
      ['add', 'Thêm từ', '+', '#FFEDB8', '#8A5D00', 'AddWord'],
      ['practice', 'Luyện tập', '✓', '#D9EFE0', '#2F7A4F', 'PracticeSetup'],
      ['settings', 'Cài đặt', '⚙', '#FFF1C7', '#8A5D00', 'Settings']
    ];
    const items = defs.map(([id, label, glyph, bg, fg, file]) => {
      const on = id === active;
      const tileBase = { display: 'inline-flex', alignItems: 'center', justifyContent: 'center', borderRadius: '9px', background: bg, color: fg, fontWeight: 800, flex: '0 0 auto' };
      let style, tile;
      if (full) {
        style = { display: 'flex', alignItems: 'center', gap: '12px', padding: '0 10px', minHeight: '46px', borderRadius: '12px', textDecoration: 'none', fontSize: '15px', fontWeight: on ? 700 : 500, color: '#2E2A24', background: on ? '#FFFDF8' : 'transparent', border: on ? '1.5px solid #CDB98C' : '1.5px solid transparent', boxShadow: on ? '0 2px 0 #E2D3B0' : 'none', boxSizing: 'border-box' };
        tile = { ...tileBase, width: '30px', height: '30px', fontSize: '14px' };
      } else {
        const big = rail;
        style = { display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: '4px', minHeight: big ? '66px' : '56px', textDecoration: 'none', fontSize: big ? '12px' : '11px', fontWeight: on ? 700 : 500, color: on ? '#CF4822' : '#8A8378', borderRadius: '14px' };
        tile = { display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: big ? '52px' : '56px', height: big ? '34px' : '32px', borderRadius: '999px', background: on ? '#FFE3D3' : 'transparent', color: on ? '#CF4822' : '#8A8378', transition: 'background 200ms ease' };
      }
      return { label, glyph, ic: full ? 16 : 22, sw: full ? '2.3' : (on ? '2.3' : '1.9'), is: { main: id === 'main', vocab: id === 'vocab', add: id === 'add', practice: id === 'practice', settings: id === 'settings' }, href: file + sfx + '.dc.html', cur: on ? 'page' : 'false', style, tile };
    });
    return { navStyle, groupStyle, full, rail, items, ln: { main: 'Main' + sfx + '.dc.html' } };
  }
}
</script>
</body>
</html>
