<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Kết quả phiên</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF7F0}
a{color:#CF4822}a:hover{color:#A83A1A}
</style>
</helmet>
<div style="{{ L.root }}">
  <main style="{{ L.main }}">
    <div style="max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; justify-content: flex-end">
        <a href="{{ ln.home }}" aria-label="Đóng" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFDF8; border: 1px solid #E8DFCC; color: #2E2A24; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
      </div>

      <section style="position: relative; background-color: #FFE6D8; background-image: radial-gradient(rgba(46,42,36,0.07) 1px, transparent 1.3px); background-size: 12px 12px; border: 1.5px solid #F4C3AB; border-radius: 22px; padding: 30px 20px 22px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; box-shadow: 0 4px 0 #F4C3AB; margin-top: 10px">
        <span aria-hidden="true" style="position: absolute; top: -9px; left: 50%; transform: translateX(-50%) rotate(-2deg); width: 56px; height: 17px; border-radius: 3px; background: repeating-linear-gradient(90deg, #F4C3AB 0 5px, rgba(255,253,248,0.6) 5px 10px)"></span>
        <svg aria-hidden="true" viewBox="0 0 320 60" style="position: absolute; left: 0; right: 0; top: 14px; width: 100%; height: 60px; pointer-events: none"><path d="M44 18l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#FFD66B"></path><path d="M276 30l2.5 7 7 2.5-7 2.5-2.5 7-2.5-7-7-2.5 7-2.5z" fill="#D9D0FF"></path><circle cx="250" cy="12" r="4" fill="#F4A98A"></circle><circle cx="74" cy="48" r="3" fill="#B8A8F0"></circle></svg>
        <div role="img" aria-label="Đúng 20 trên 24 câu, 83%" style="position: relative; width: 148px; height: 148px; border-radius: 999px; background: conic-gradient(#CF4822 0 83%, #FFFDF8 83% 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 #F4C3AB">
          <div style="width: 118px; height: 118px; border-radius: 999px; background: #FFFDF8; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 36px; font-weight: 800; letter-spacing: -0.03em; color: #2E2A24">83%</span><span style="font-size: 13px; font-weight: 600; color: #6B6358">20/24 đúng</span></div>
        </div>
        <h1 style="{{ L.h1 }}">Xong phiên hôm nay!</h1>
        <span style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; background: #FFFDF8; color: #A83A1A; font-size: 14px; font-weight: 800; box-shadow: 0 2px 0 #F4C3AB"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="#CF4822"><path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.5 1.2-4 2.5-5 .2 1.8 1 3 2.5 3.5C11 8.5 11 5 12 2z"></path></svg>Chuỗi 13 ngày · giữ lửa nhé</span>
      </section>

      <div style="{{ L.stats }}">
        <div style="background: #ECE6FF; border: 1.5px solid #D3C8F7; border-radius: 16px; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 3px 0 #D3C8F7"><span style="width: 34px; height: 34px; border-radius: 10px; background: #FFFDF8; color: #5B40C9; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M9 2h6"></path></svg></span><span style="display: flex; flex-direction: column"><b style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em">9 phút</b><span style="font-size: 12px; font-weight: 600; color: #4D463C">thời gian học</span></span></div>
        <div style="background: #FFF1C7; border: 1.5px solid #EFD993; border-radius: 16px; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 3px 0 #EFD993"><span style="width: 34px; height: 34px; border-radius: 10px; background: #FFFDF8; color: #8A5D00; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"></path></svg></span><span style="display: flex; flex-direction: column"><b style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em">58→61%</b><span style="font-size: 12px; font-weight: 600; color: #4D463C">thông thạo TB</span></span></div>
        <div style="background: #FCE4EA; border: 1.5px solid #F1C2CF; border-radius: 16px; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 3px 0 #F1C2CF"><span style="width: 34px; height: 34px; border-radius: 10px; background: #FFFDF8; color: #A8324F; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"></path></svg></span><span style="display: flex; flex-direction: column"><b style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em">+2 từ</b><span style="font-size: 12px; font-weight: 600; color: #4D463C">đạt 100%</span></span></div>
      </div>

      <section style="background: #FFFDF8; border: 1px solid #E8DFCC; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 2px 0 #EDE4D2">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap">
          <span style="display: flex; align-items: center; gap: 10px"><span style="width: 34px; height: 34px; border-radius: 10px; background: #FFE3D3; color: #CF4822; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg></span><h2 style="margin: 0; font-size: 18px; font-weight: 800">Thay đổi từng từ</h2></span>
          <div role="tablist" aria-label="Lọc kết quả" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 10px; background: #EEE7D8">
            <button type="button" role="tab" aria-selected="{{ allSel }}" onClick="{{ showAll }}" style="{{ segAll }}">Tất cả · 24</button>
            <button type="button" role="tab" aria-selected="{{ wrongSel }}" onClick="{{ showWrong }}" style="{{ segWrong }}">Sai · 4</button>
          </div>
        </div>
        <div style="display: flex; flex-direction: column">
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
            <a href="{{ ln.word }}" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 0; border-bottom: 1px solid #F1EBDE; text-decoration: none; color: #2E2A24">
              <span style="{{ r.dot }}">{{ r.mark }}</span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><strong style="font-size: 15px">{{ r.w }}</strong><span style="font-size: 13px; color: #6B6358">{{ r.mode }}</span></span>
              <span style="display: flex; flex-direction: column; align-items: flex-end"><span style="{{ r.delta }}">{{ r.change }}</span><span style="font-size: 13px; color: #6B6358">{{ r.range }}</span></span>
            </a>
          </sc-for>
        </div>
      </section>
    </div>
  </main>
  <footer style="{{ L.bottom }}">
    <a href="{{ ln.home }}" style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 12px; border: 1px solid #E8DFCC; background: #FFFDF8; color: #2E2A24; font-size: 15px; font-weight: 700; text-decoration: none; box-shadow: 0 2px 0 #EDE4D2">Về trang chủ</a>
    <a href="{{ ln.flash }}" style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 12px; background: #CF4822; color: #FFFFFF; font-size: 15px; font-weight: 700; text-decoration: none; box-shadow: 0 3px 0 #A83A1A">Ôn lại 4 từ sai</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"device":{"editor":"enum","options":["laptop","ipad","iphone"],"default":"laptop"},"frameH":{"editor":null},"$preview":{"width":1440,"height":980}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 'all' }; }
  layout() {
    const d = this.props.device ?? 'laptop';
    const laptop = d === 'laptop', tablet = d === 'ipad', phone = d === 'iphone';
    const fh = this.props.frameH ?? (tablet ? 1180 : 844);
    const ink = { background: '#FBF7F0', fontFamily: "'Be Vietnam Pro', Inter, system-ui, sans-serif", color: '#2E2A24', display: 'flex', flexDirection: 'column' };
    const px = laptop ? '40px' : tablet ? '32px' : '16px';
    return { d, sfx: laptop ? '' : tablet ? 'Tablet' : 'Phone', L: {
      root: laptop ? { ...ink, minHeight: '100vh' } : { ...ink, width: '100%', minHeight: fh + 'px' },
      main: { flex: '1 1 auto', padding: (phone ? '14px ' : '24px ') + px + ' 12px', boxSizing: 'border-box' },
      bottom: { display: 'flex', gap: '12px', padding: (phone ? '12px ' + px + ' 30px' : '16px ' + px + ' 40px'), maxWidth: '800px', width: '100%', margin: '0 auto', boxSizing: 'border-box' },
      h1: { margin: 0, fontSize: phone ? '26px' : '30px', fontWeight: 800, letterSpacing: '-0.025em' },
      stats: { display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0, 1fr))', gap: phone ? '8px' : '12px' }
    } };
  }
  renderVals() {
    const { d, sfx, L } = this.layout();
    const s = this.state;
    const seg = (on) => ({ minHeight: '36px', padding: '0 12px', borderRadius: '6px', border: 'none', background: on ? '#FFFDF8' : 'transparent', color: on ? '#2E2A24' : '#6B6358', font: 'inherit', fontSize: '13px', fontWeight: 700, cursor: 'pointer', boxShadow: on ? '0 1px 3px rgba(46,42,36,0.12)' : 'none', whiteSpace: 'nowrap' });
    const data = [
      ['negotiate', 'Chọn nghĩa', true, 90, 100], ['deadline', 'Flashcard', true, 90, 100],
      ['reluctant', 'Chọn nghĩa', false, 30, 10], ['albeit', 'Chọn nghĩa', false, 0, 0],
      ['ubiquitous', 'Flashcard', true, 20, 30], ['meticulous', 'Điền chỗ trống', false, 10, 0],
      ['appreciate', 'Flashcard', true, 50, 60], ['scrutinize', 'Chọn nghĩa', false, 20, 0]
    ];
    const rows = data.filter((r) => s.filter === 'all' || !r[2]).map(([w, mode, ok, a, b]) => ({ w, mode, mark: ok ? '✓' : '✕',
      change: (b - a >= 0 ? '+' : '−') + Math.abs(b - a) + '%', range: a + '% → ' + b + '%' + (b === 100 ? ' · thành thạo' : ''),
      dot: { flex: '0 0 32px', width: '32px', height: '32px', borderRadius: '999px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, fontSize: '14px', background: ok ? '#FFE3D3' : '#FCE4EA', color: ok ? '#CF4822' : '#A8324F' },
      delta: { fontSize: '15px', fontWeight: 700, color: ok ? '#A83A1A' : '#B0304A' } }));
    return { device: d, L, rows,
      allSel: String(s.filter === 'all'), wrongSel: String(s.filter === 'wrong'),
      showAll: () => this.setState({ filter: 'all' }), showWrong: () => this.setState({ filter: 'wrong' }),
      segAll: seg(s.filter === 'all'), segWrong: seg(s.filter === 'wrong'),
      ln: { home: 'Main' + sfx + '.dc.html', flash: 'Flashcard' + sfx + '.dc.html', word: 'WordDetail' + sfx + '.dc.html' } };
  }
}
</script>
</body>
</html>
