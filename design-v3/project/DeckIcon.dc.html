<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Icon bộ từ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<span style="{{ wrap }}">
  <svg aria-hidden="true" width="{{ sz }}" height="{{ sz }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <sc-if value="{{ is.mine }}" hint-placeholder-val="{{ false }}"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"></path></sc-if>
    <sc-if value="{{ is.comm }}" hint-placeholder-val="{{ false }}"><path d="M4 5h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H9l-4 3v-3H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"></path><path d="M19 9h1a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-1v2.5L16 18"></path></sc-if>
    <sc-if value="{{ is.phr }}" hint-placeholder-val="{{ false }}"><path d="M4 8h12M12 4l4 4-4 4"></path><path d="M20 16H8M12 12l-4 4 4 4"></path></sc-if>
    <sc-if value="{{ is.idiom }}" hint-placeholder-val="{{ false }}"><path d="M5 11h4v7H3v-5c0-4 2-6 5-7"></path><path d="M15 11h4v7h-6v-5c0-4 2-6 5-7"></path></sc-if>
    <sc-if value="{{ is.daily }}" hint-placeholder-val="{{ false }}"><path d="M3.5 10.5L12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"></path></sc-if>
    <sc-if value="{{ is.travel }}" hint-placeholder-val="{{ false }}"><path d="M10.5 13.5L3 11l1.5-1.5 8 1L17 6a2 2 0 0 1 3 3l-4.5 4.5 1 8L15 23l-2.5-7.5L9 19v3l-1.5 1-1-3.5L3 18.5l1-1.5h3z"></path></sc-if>
    <sc-if value="{{ is.food }}" hint-placeholder-val="{{ false }}"><path d="M4 9h13v5a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z"></path><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17"></path><path d="M8 2v3M12 2v3"></path></sc-if>
    <sc-if value="{{ is.it }}" hint-placeholder-val="{{ false }}"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M2 20h20M9 9l-2 2 2 2M15 9l2 2-2 2"></path></sc-if>
    <sc-if value="{{ is.work }}" hint-placeholder-val="{{ false }}"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"></path></sc-if>
    <sc-if value="{{ is.mkt }}" hint-placeholder-val="{{ false }}"><path d="M3 11v3a1 1 0 0 0 1 1h3l6 4V6L7 10H4a1 1 0 0 0-1 1z"></path><path d="M17 9a4 4 0 0 1 0 6M19.5 6.5a8 8 0 0 1 0 11"></path></sc-if>
    <sc-if value="{{ is.toeic }}" hint-placeholder-val="{{ false }}"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M8.5 15l2.5 2.5 4.5-5"></path></sc-if>
    <sc-if value="{{ is.ielts }}" hint-placeholder-val="{{ false }}"><path d="M2 9l10-5 10 5-10 5z"></path><path d="M6 11v5c3 2.5 9 2.5 12 0v-5M22 9v6"></path></sc-if>
    <sc-if value="{{ is.iw }}" hint-placeholder-val="{{ false }}"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"></path><path d="M14 6l3 3M4 22h16"></path></sc-if>
  </svg>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"deck":{"editor":"enum","options":["mine","comm","phr","idiom","daily","travel","food","it","work","mkt","toeic","ielts","iw"],"default":"comm"},"size":{"editor":"int","default":22},"$preview":{"width":48,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    const id = this.props.deck ?? 'comm';
    const ids = ['mine', 'comm', 'phr', 'idiom', 'daily', 'travel', 'food', 'it', 'work', 'mkt', 'toeic', 'ielts', 'iw'];
    const is = {}; ids.forEach((k) => { is[k] = k === id; });
    const sz = this.props.size ?? 22;
    return { is, sz, wrap: { display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: '100%', height: '100%', lineHeight: 0 } };
  }
}
</script>
</body>
</html>
